
name: Build Eldoria NDS

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20260610
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Add devkitPro tools to PATH
        run: |
          echo "$DEVKITARM/bin" >> "$GITHUB_PATH"
          echo "$DEVKITPRO/tools/bin" >> "$GITHUB_PATH"

      - name: Add devkitARM to PATH
        run: |
          echo "$DEVKITARM/bin" >> "$GITHUB_PATH"
          echo "$DEVKITPRO/tools/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"
          arm-none-eabi-gcc --version
          make --version

      - name: Install Nintendo DS libraries
        run: |
          if command -v dkp-pacman >/dev/null 2>&1; then
            dkp-pacman -Sy --noconfirm nds-dev
          else
            "$DEVKITPRO/pacman/bin/pacman" -Sy --noconfirm nds-dev
          fi

      - name: Build Nintendo DS ROM
        run: |
          make clean || true
          make

      - name: Verify NDS output
        run: |
          test -f eldoria_v01.nds
          file eldoria_v01.nds
          ls -lh eldoria_v01.nds

      - name: Upload ROM and build files
        uses: actions/upload-artifact@v4
        with:
          name: Eldoria-V0.1-NDS-and-build
          path: |
            eldoria_v01.nds
            build/
          if-no-files-found: error
          retention-days: 30
